[package]
name = "tasker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
crossterm = "0.28"
dirs = "6.0"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
